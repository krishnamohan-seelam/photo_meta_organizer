# Tool configuration only. Package metadata, dependencies and the version live in the
# repo-root pyproject.toml (managed with uv); ruff and black are configured there too.

# ============================================================================
# MYPY CONFIGURATION - Static Type Checking
# ============================================================================
# Enforces strict type checking to catch bugs before runtime.
# The Photo Meta Organizer codebase follows strict mypy rules to ensure
# type safety, especially important for the immutable domain layer.
# ============================================================================

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True

# Strict mode: disallow unsafely inferred types
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
check_untyped_defs = True
no_implicit_optional = True
warn_incomplete_stub = True

# Tests import `tests.conftest`, so mypy would see them under two module names; they are
# not type-checked anyway (see [mypy-tests.*]).
exclude = (^|/)tests/

# Error reporting
show_error_codes = True
show_error_context = True
pretty = True

# Ignore type errors in test files (slightly relaxed for test code)
[mypy-tests.*]
ignore_errors = True
disallow_untyped_defs = False

# boto3 is the optional `s3` extra (pip install photo-meta-organizer[s3]).
[mypy-boto3.*]
ignore_missing_imports = True
